<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Update CVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-indigo-100 via-white to-indigo-100 min-h-screen flex items-center justify-center px-4">

<div class="bg-white shadow-2xl rounded-2xl w-full max-w-lg p-10">
    <h1 class="text-3xl font-bold text-center text-indigo-600 mb-8">Update CVE</h1>

    <!-- Messages -->
    <div th:if="${error}" class="text-red-600 font-medium text-center mb-3">
        <p th:text="${error}"></p>
    </div>
    <div th:if="${failed}">
        <script th:inline="javascript">
            alert([[${failed}]]);
        </script>
    </div>
    <div th:if="${success}">
        <script th:inline="javascript">
            alert([[${success}]]);
        </script>
    </div>

    <form th:action="@{/admin/update-cve}" th:object="${cve}" method="post" class="space-y-5">

        <input type="number" th:field="*{id}" placeholder="ID (Unique)"
               class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-400" required />

        <input type="text" th:field="*{cveData}" placeholder="CVE Data"
               class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-400" required />

        <input type="text" th:field="*{cvePackage}" placeholder="CVE Package"
               class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-400" required />

        <!-- Versions -->
        <div class="flex space-x-4">
            <input type="text" th:field="*{versions.cve_version_start}" placeholder="Version Start"
                   class="flex-1 px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-400" />
            <input type="text" th:field="*{versions.cve_version_end}" placeholder="Version End"
                   class="flex-1 px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-400" />
        </div>

        <input type="text" th:field="*{cveDescription}" placeholder="CVE Description"
               class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-400" required />

        <!-- Role Dropdown -->
        <select th:field="*{role}" required
                class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-400">
            <option value="" disabled th:selected="${cve.role == null}">Select Role</option>
            <option th:each="r : ${roles}" th:value="${r}" th:text="${r}" th:selected="${cve.role == r}"></option>
        </select>

        <input type="number" th:field="*{deptId}" placeholder="Department ID"
               class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-400" required />

        <button type="submit" class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-xl hover:bg-indigo-700 transition duration-200">
            Update CVE
        </button>
    </form>
</div>

</body>
</html>
